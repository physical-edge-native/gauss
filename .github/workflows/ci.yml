name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The job name "checks (<os>)" is required by the ruleset that protects main; keep it.
  check:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci-check.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The CPU build of PyTorch (the default wheel on Linux carries CUDA libraries of several GB).
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --quiet -e ".[test,train]"
      - uses: actions/cache@v6
        with:
          path: third_party/models
          key: models-${{ hashFiles('gauss/models.lock.json') }}
      - run: python -m gauss.models fetch
      - run: python -m pytest -q
